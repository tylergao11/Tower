<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新野 · 美术预览</title><link rel="stylesheet" href="./style.css"></head><body>
<header><div class="brand"><small>三国机关塔防</small><h1>新野</h1><span>美术预览</span></div><nav aria-label="预览内容"><button data-view="story" aria-pressed="true">营帐剧情</button><button data-view="battle">城防全景</button><button data-view="library">动作与部件</button></nav><button id="play">暂停</button></header>
<main><section id="stage-wrap"><canvas id="stage" width="1672" height="941" aria-label="游戏美术动画预览"></canvas><div id="loading" role="status">正在载入画面…</div></section>
<section id="controls" hidden><label>对象<select id="object"></select></label><label>动作<select id="action"></select></label><label>进度<input id="phase" type="range" min="0" max="1000" value="0"></label><button id="flip">转向</button><label class="check"><input id="parts" type="checkbox">展开部件</label><label class="check"><input id="shield" type="checkbox" checked>显示盾牌</label></section>
<footer><span id="caption">营帐 · 刘备观舞</span><span id="metrics"></span></footer><p id="error" role="alert" hidden></p></main><script type="module" src="./app.js"></script></body></html>
